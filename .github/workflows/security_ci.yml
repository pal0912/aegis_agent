name: AegisAgent Enterprise Security CI/CD Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-validation:
    name: Defense-in-Depth Validation & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Code Quality & Static Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 aegis/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero on style warnings
          flake8 aegis/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Execute Full Security Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Adversarial Security Benchmark & Quality Gate
        run: |
          python -c "
          import sys
          from evals.benchmark import run_all_evals

          print('Running AegisAgent Adversarial Benchmark Suite...')
          metrics = run_all_evals()

          print('\n=== Aegis CI/CD Benchmark Results ===')
          asr = metrics.get('attack_success_rate', 1.0)
          containment = metrics.get('total_containment_rate', 0.0)
          ledger_valid = metrics.get('ledger_integrity_verified', False)

          print(f'Attack Success Rate (ASR): {asr:.2%}')
          print(f'Total Containment Rate:   {containment:.2%}')
          print(f'Ledger Integrity Valid:   {ledger_valid}')

          failures = []
          if asr > 0.0:
            failures.append(f'Quality Gate Failed: ASR must be 0.00%, got {asr:.2%}')
          if containment < 1.0:
            failures.append(f'Quality Gate Failed: Total Containment must be 100.00%, got {containment:.2%}')
          if not ledger_valid:
            failures.append('Quality Gate Failed: Cryptographic Merkle Audit Ledger failed integrity check!')

          if failures:
            for f in failures:
              print(f'ERROR: {f}', file=sys.stderr)
            sys.exit(1)

          print('\nSUCCESS: All Aegis Security Quality Gates Passed with Zero Compromises.')
          "
